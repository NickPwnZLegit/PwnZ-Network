name: PwnZ Social Release Checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/social-messenger-unified-testnet-2026-10-30]
permissions:
  contents: read
jobs:
  social-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Security and release checks
        run: node --test security/release-gates.test.cjs
      - name: Private media staging policy checks (disabled)
        run: node --test security/pwnz-media-policy.test.mjs
      - name: Non-recording live video and quota checks (disabled)
        run: node --test security/pwnz-live-media-quotas.test.mjs
      - name: Preview-only media preflight cannot enable production uploads
        run: node --test security/pwnz-media-preflight-preview.test.mjs
      - name: Media Storage candidate deny-by-default checks
        run: node --test security/pwnz-media-rules-default-deny.test.mjs
      - name: JavaScript parse and module syntax checks
        run: |
          node --check social/social.js
          node --check members/members.js
          node --check messenger/pwnz/app.js
          node --check messenger/messenger.js
