name: PwnZ Social Release Checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/social-messenger-unified-testnet-2026-10-30]
permissions:
  contents: read
jobs:
  social-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Security and release checks
        run: node --test security/release-gates.test.cjs
      - name: HOPE and PWNZ token policy
        run: node --test security/pwnz-token-scope.test.mjs
      - name: Trusted external media link contract
        run: node --test security/pwnz-external-video-links-release.test.mjs
      - name: Cross-network homepage and global navigation links
        run: node --test security/pwnz-network-home-links.test.mjs
      - name: Existing Eden RealID sign-in and Gamertag recovery regression
        run: node --test security/pwnz-existing-eden-gamertag-recheck.test.mjs
      - name: Existing Eden sign-in UI status regression
        run: node --test security/pwnz-signed-in-onboarding-ui.test.mjs
      - name: JavaScript parse and module syntax checks
        run: |
          node --check social/social.js
          node --check members/members.js
          node --check messenger/pwnz/app.js
          node --check messenger/messenger.js
