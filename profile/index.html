
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071322">
  <title>My Profile | PwnZ Network</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #071322;
      color: #eafaff;
      text-align: center;
    }
    main { padding: 24px; }
    a { color: #77ffc1; }
  </style>
</head>
<body>
  <main>
    <h1>PwnZ Network</h1>
    <p>Opening your account...</p>
    <p><a href="/social/">Open PwnZ Profile</a></p>
  </main>

  <script type="module">
    import {
      initializeApp,
      getApps,
      getApp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    async function openProfile() {
      try {
        const response = await fetch("/api/pwnz-config", {
          cache: "no-store"
        });

        if (!response.ok) throw new Error("Configuration unavailable");

        const data = await response.json();
        if (!data.configured || !data.config) {
          throw new Error("Authentication not configured");
        }

        const app = getApps().length
          ? getApp()
          : initializeApp(data.config);

        const auth = getAuth(app);

        onAuthStateChanged(
          auth,
          user => {
            location.replace(
              user
                ? "/social/#profile-section"
                : "/social/#auth-panel"
            );
          },
          () => location.replace("/social/")
        );
      } catch {
        location.replace("/social/");
      }
    }

    openProfile();
  </script>
</body>
</html>
