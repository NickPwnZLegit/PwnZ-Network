<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PwnZ Member Messenger</title><style>body{background:#071322;color:#eefaff;font:16px system-ui;margin:25px auto;max-width:900px}a{color:#80ffc3}.panel{border:1px solid #356078;border-radius:12px;padding:20px;margin:14px 0}button,input,textarea{padding:12px;background:#113047;color:white;border:1px solid #456e87;border-radius:9px;font:inherit}textarea{width:90%}.message{padding:8px;margin:8px 0;background:#16394c;border-radius:8px}#messages{max-height:350px;overflow:auto}[hidden]{display:none!important}</style></head><body><nav><a href="/">PwnZ</a> · <a href="/social/">Social</a> · <a href="/members/">Members</a> · <a href="/messenger/">Eden inbox</a></nav><h1>PwnZ Messenger</h1><p>Connect through mutual follows. Both members must accept current community rules to send messages.</p><p id="status" role="status">Loading…</p><section id="login" class="panel" hidden><a href="/social/#auth-panel">Sign in or create an account</a></section><section id="inbox" hidden><form id="find" class="panel"><label for="handle">PwnZ member name</label><input id="handle" required pattern="[a-z][a-z0-9_]{2,23}" maxlength="24" placeholder="gamer_name"><button>Open chat</button></form><div class="panel"><h2>Conversations</h2><div id="threads"></div></div><div class="panel"><h2 id="chat-title">Select a conversation</h2><div id="messages"></div><form id="send" hidden><textarea id="draft" required maxlength="3000"></textarea><button>Send</button></form><button id="block" type="button" hidden>Block member</button></div></section><script type="module" src="./app.js"></script></body></html>
